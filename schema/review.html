<!-- ============================================================
     REVIEW SCHEMA MARKUP FOR MY BAKING CREATIONS
     HOW TO USE THIS:
     1. Copy this entire block of code
     2. Paste it inside the <head> section of your webpage
     3. Replace the placeholder values (marked with arrows below)
        with your real review information
     4. Test it at: https://search.google.com/test/rich-results
     ============================================================ -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",

  <!-- The type of schema — do not change this value -->
  "@type": "Review",

  <!-- ► CHANGE THIS: The name of the product, service, or business being reviewed -->
  "itemReviewed": {
    "@type": "LocalBusiness",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  },

  <!-- ► CHANGE THIS: Information about the person who wrote the review -->
  "author": {
    "@type": "Person",
    "name": "Sarah Thompson"
  },

  <!-- ► CHANGE THIS: The star rating given in this review -->
  <!-- ratingValue = the score given (e.g. 5)          -->
  <!-- bestRating  = the highest possible score (e.g. 5) -->
  <!-- worstRating = the lowest possible score (e.g. 1)  -->
  "reviewRating": {
    "@type": "Rating",
    "ratingValue": "5",
    "bestRating": "5",
    "worstRating": "1"
  },

  <!-- ► CHANGE THIS: The full text of the review exactly as it appears on your page -->
  "reviewBody": "My Baking Creations made the most beautiful and delicious custom birthday cake for my daughter's party. The attention to detail was incredible, the flavors were amazing, and everyone kept asking where we got it. I will absolutely be ordering again for every special occasion!",

  <!-- ► CHANGE THIS: The date the review was published (format must be YYYY-MM-DD) -->
  "datePublished": "2024-03-15",

  <!-- The publisher of the review — update with your website details -->
  "publisher": {
    "@type": "Organization",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  }

}
</script>

<!-- ============================================================
     TIPS FOR NON-TECHNICAL USERS:

     • "name" under author    → Type the reviewer's real name
     • "ratingValue"          → Change to the number of stars (1–5)
     • "reviewBody"           → Paste the exact review text shown on your page
     • "datePublished"        → Use the format YYYY-MM-DD (e.g. 2024-06-01)

     IMPORTANT: The review text and rating in this code MUST match
     exactly what visitors can read on your webpage. Google will
     penalise mismatches.

     To add MORE reviews, copy the entire <script> block above
     and paste it below this one, then update the values.
     ============================================================ -->
