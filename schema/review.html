<!-- ============================================================
     REVIEW SCHEMA MARKUP FOR MY BAKING CREATIONS
     HOW TO USE THIS:
     1. Copy this entire block of code
     2. Paste it inside the <head> section of your webpage
     3. Replace the placeholder values (marked with arrows below)
        with your real review information
     4. Test it at: https://search.google.com/test/rich-results
     ============================================================ -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",

  <!-- The type of schema — do not change this value -->
  "@type": "Review",

  <!-- ── WHAT IS BEING REVIEWED ──────────────────────────────
       This section describes your business.
       Update "name" and "url" to match your business exactly. -->
  "itemReviewed": {
    "@type": "Bakery",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  },

  <!-- ── REVIEW AUTHOR ──────────────────────────────────────
       Replace "Jane Smith" with the real name of the reviewer.
       This name MUST appear visibly on the same page. -->
  "author": {
    "@type": "Person",
    "name": "Jane Smith"
  },

  <!-- ── STAR RATING ────────────────────────────────────────
       ratingValue = the score given by this reviewer (e.g. 5)
       bestRating  = the highest possible score (usually 5)
       worstRating = the lowest possible score (usually 1)
       Only change "ratingValue" to match the actual review. -->
  "reviewRating": {
    "@type": "Rating",
    "ratingValue": "5",
    "bestRating": "5",
    "worstRating": "1"
  },

  <!-- ── REVIEW DATE ────────────────────────────────────────
       Replace the date below with the date the review was written.
       Format must be: YYYY-MM-DD  (Year-Month-Day)
       Example: "2024-03-15" means March 15, 2024 -->
  "datePublished": "2024-06-10",

  <!-- ── REVIEW TEXT ────────────────────────────────────────
       Replace the text below with the actual review content.
       This text MUST match word-for-word what is visible on the page.
       Do not include special characters like quotation marks inside the text. -->
  "reviewBody": "My Baking Creations made the most beautiful and delicious custom cake for my daughter's birthday. The flavors were incredible, the decorations were exactly what we asked for, and it arrived perfectly on time. I could not recommend them more highly — truly a five-star experience from start to finish!",

  <!-- ── REVIEW HEADLINE ─────────────────────────────────────
       A short title or summary for the review (like a subject line).
       Replace with the actual headline shown on the page, if any. -->
  "name": "Absolutely the best custom cakes in town!",

  <!-- ── YOUR WEBSITE ───────────────────────────────────────
       This links the review back to your website.
       You can leave this as-is — it already uses your URL. -->
  "publisher": {
    "@type": "Organization",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  }

}
</script>

<!-- ============================================================
     IMPORTANT REMINDERS:
     ✅ Every value in this schema MUST match text visible on the page.
     ✅ You can copy this entire block multiple times — once per review.
     ✅ After updating, test at: https://search.google.com/test/rich-results
     ✅ Do NOT use curly quotes (" ") — only use straight quotes (" ")
     ============================================================ -->
