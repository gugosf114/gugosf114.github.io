<!-- ============================================================
     REVIEW SCHEMA MARKUP FOR MY BAKING CREATIONS
     HOW TO USE THIS:
     1. Copy this entire block of code
     2. Paste it inside the <head> section of your webpage
     3. Replace the placeholder values (marked with arrows below)
        with your real review information
     4. Test it at: https://search.google.com/test/rich-results
     ============================================================ -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",

  <!-- The type of schema — do not change this value -->
  "@type": "Review",

  <!-- ============================================================
       ITEM BEING REVIEWED
       Change "My Baking Creations" to match your business name
       exactly as it appears on your website
       ============================================================ -->
  "itemReviewed": {
    "@type": "Bakery",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  },

  <!-- ============================================================
       REVIEW AUTHOR
       Replace "Jane Smith" with the real name of the person
       who wrote this review
       ============================================================ -->
  "author": {
    "@type": "Person",
    "name": "Jane Smith"
  },

  <!-- ============================================================
       STAR RATING
       ratingValue = the score given by the reviewer (e.g. 5)
       bestRating  = the highest possible score on your scale (e.g. 5)
       worstRating = the lowest possible score on your scale (e.g. 1)
       Only change ratingValue to reflect the actual review score
       ============================================================ -->
  "reviewRating": {
    "@type": "Rating",
    "ratingValue": "5",
    "bestRating": "5",
    "worstRating": "1"
  },

  <!-- ============================================================
       REVIEW BODY
       Replace the text below with the exact review text that
       appears visibly on your webpage — the two must match
       ============================================================ -->
  "reviewBody": "My Baking Creations made the most beautiful and delicious custom birthday cake for my daughter. The flavors were incredible, the decorations were exactly what we asked for, and it arrived perfectly on time. I could not recommend them more highly — truly a five-star experience from start to finish!",

  <!-- ============================================================
       DATE PUBLISHED
       Replace with the date the review was published
       Format must be: YYYY-MM-DD  (Year-Month-Day)
       Example: 2024-03-15 means March 15, 2024
       ============================================================ -->
  "datePublished": "2024-03-15",

  <!-- ============================================================
       PUBLISHER / WEBSITE
       This tells search engines where the review is published
       You can leave the name and url as-is if this review
       lives on your own website
       ============================================================ -->
  "publisher": {
    "@type": "Organization",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  }

}
</script>

<!-- ============================================================
     IMPORTANT REMINDERS:
     - The reviewBody text above MUST match the review text
       that visitors can actually read on your page
     - Do not invent or fabricate reviews — use only real ones
     - Add a separate copy of this entire block for each
       individual review you want to mark up
     - After adding to your site, test at:
       https://search.google.com/test/rich-results
     ============================================================ -->
