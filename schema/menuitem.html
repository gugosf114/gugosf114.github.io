<!-- ============================================================
     MENU ITEM SCHEMA MARKUP FOR MY BAKING CREATIONS
     Website: https://mybakingcreations.com

     HOW TO USE THIS CODE:
     1. Copy this entire block of code
     2. Paste it into the <head> section of your webpage
        (or just before the closing </body> tag)
     3. Replace the placeholder values with your real information
     4. Each section below has comments explaining what to change
     5. After updating, test your page at:
        https://search.google.com/test/rich-results
     ============================================================ -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MenuItem",

  <!-- ============================================================
       BASIC ITEM INFORMATION
       Change "name" to the exact name of your menu item as it
       appears on your website or menu.
       Change "description" to a short, appealing description
       of the item (1-2 sentences works best).
       ============================================================ -->
  "name": "Classic Vanilla Birthday Cake",
  "description": "A light and fluffy three-layer vanilla sponge cake filled with silky buttercream frosting and topped with hand-piped rosettes. Perfect for birthdays and special celebrations.",

  <!-- ============================================================
       ITEM URL
       Change this to the full web address of the page where
       this specific menu item is listed on your website.
       ============================================================ -->
  "url": "https://mybakingcreations.com/menu/classic-vanilla-birthday-cake",

  <!-- ============================================================
       ITEM IMAGE
       Change this to the full web address of a photo of your item.
       Use a high-quality image (at least 800x600 pixels recommended).
       The image must already be uploaded to your website.
       ============================================================ -->
  "image": {
    "@type": "ImageObject",
    "url": "https://mybakingcreations.com/images/classic-vanilla-birthday-cake.jpg",
    "width": 1200,
    "height": 900,
    "caption": "Classic Vanilla Birthday Cake by My Baking Creations"
  },

  <!-- ============================================================
       MENU SECTION
       This tells search engines which part of your menu this
       item belongs to. Change "name" to your category name,
       for example: "Cakes", "Cupcakes", "Cookies", "Pastries".
       ============================================================ -->
  "suitableForDiet": "https://schema.org/HalalDiet",

  "inMenuSection": {
    "@type": "MenuSection",
    "name": "Custom Cakes",
    "description": "Handcrafted celebration cakes made to order for any occasion"
  },

  <!-- ============================================================
       PRICING INFORMATION
       Change "price" to the actual price of your item (numbers only,
       no dollar sign — the currency is set separately).
       Change "priceCurrency" if you use a currency other than USD:
         USD = US Dollar | GBP = British Pound | EUR = Euro
         CAD = Canadian Dollar | AUD = Australian Dollar
       Change "availability" if the item is not always available:
         InStock = Available now
         OutOfStock = Not currently available
         PreOrder = Must be ordered in advance
       ============================================================ -->
  "offers": {
    "@type": "Offer",
    "price": "65.00",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock",
    "url": "https://mybakingcreations.com/menu/classic-vanilla-birthday-cake",
    "seller": {
      "@type": "LocalBusiness",
      "name": "My Baking Creations",
      "url": "https://mybakingcreations.com"
    }
  },

  <!-- ============================================================
       NUTRITION INFORMATION
       Fill in the nutritional values for a single serving of
       your item. If you do not know these values, you can:
         - Remove this entire "nutrition" section, OR
         - Ask your recipe software or nutritionist for the values
       
       "servingSize" = describe one portion (e.g., "1 slice", "1 cupcake")
       "calories" = number of calories per serving
       All other values use grams (g) or milligrams (mg) as noted.
       ============================================================ -->
  "nutrition": {
    "@type": "NutritionInformation",
    "servingSize": "1 slice (approximately 120g)",
    "calories": "420 calories",
    "fatContent": "18 g",
    "saturatedFatContent": "10 g",
    "transFatContent": "0 g",
    "carbohydrateContent": "62 g",
    "sugarContent": "45 g",
    "fiberContent": "1 g",
    "proteinContent": "5 g",
    "sodiumContent": "280 mg",
    "cholesterolContent": "75 mg"
  },

  <!-- ============================================================
       MENU ITEM ADDITIONAL DETAILS
       "menuAddOn" lists optional extras customers can add.
       Remove any add-ons that do not apply to your business,
       or add more by copying the {} block pattern.
       ============================================================ -->
  "menuAddOn": [
    {
      "@type": "MenuItem",
      "name": "Custom Message Topper",
      "description": "Add a personalized edible message or name to your cake",
      "offers": {
        "@type": "Offer",
        "price": "5.00",
        "priceCurrency": "USD"
      }
    },
    {
      "@type": "MenuItem",
      "name": "Extra Decorative Flowers",
      "description": "Add a bouquet of handcrafted sugar flowers to the top of your cake",
      "offers": {
        "@type": "Offer",
        "price": "15.00",
        "priceCurrency": "USD"
      }
    }
  ],

  <!-- ============================================================
       BUSINESS / PROVIDER INFORMATION
       This links the menu item back to your business.
       Update "name" and "url" if they are different from what
       is shown below.
       ============================================================ -->
  "provider": {
    "@type": "LocalBusiness",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com",
    "telephone": "+1-555-000-0000",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "123 Bakery Lane",
      "addressLocality": "Your City",
      "addressRegion": "Your State",
      "postalCode": "00000",
      "addressCountry": "US"
    }
  }

}
</script>
