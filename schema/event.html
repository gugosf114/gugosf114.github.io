<script type="application/ld+json">
{

       EVENT SCHEMA FOR MY BAKING CREATIONS

  "@context": "https://schema.org",
  "@type": "Event",

  <!-- ============================================================
       EVENT NAME
       --> Replace "Holiday Cookie Decorating Class" with your event title
       ============================================================ -->
  "name": "Holiday Cookie Decorating Class",

       --> Replace with the full web address of your event page
       ============================================================ -->
  "url": "https://mybakingcreations.com/events/holiday-cookie-decorating-class",

       EVENT DESCRIPTION

  <!-- ============================================================
       START DATE AND TIME
       --> Format: YYYY-MM-DDTHH:MM:SS
           Example: 2024-12-14T10:00:00 means December 14, 2024 at 10:00 AM
           Change the date and time to match your event exactly.
       ============================================================ -->
  "startDate": "2024-12-14T10:00:00",

  <!-- ============================================================
       END DATE AND TIME
       --> Format: YYYY-MM-DDTHH:MM:SS

       ============================================================ -->

           "https://schema.org/EventPostponed"   -- Event has been postponed
           "https://schema.org/EventRescheduled" -- Event has been moved to new date
       ============================================================ -->

       EVENT ATTENDANCE MODE
       --> Options you can use (copy one exactly as shown):

       ============================================================ -->

    "@type": "Organization",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
