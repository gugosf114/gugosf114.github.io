<script type="application/ld+json">
{
  /* ============================================================
     MY BAKING CREATIONS — EVENT SCHEMA MARKUP
     Website: https://mybakingcreations.com

     HOW TO USE THIS SCHEMA:
     1. Copy this entire <script> block into the <head> section
        of the page that describes your event.
     2. Replace every placeholder value (marked with arrows -->)
        with your real event details.
     3. Make sure the details here EXACTLY match what visitors
        see on the page — Google checks for consistency.
     4. Test your page at: https://search.google.com/test/rich-results
     ============================================================ */

  "@context": "https://schema.org",

  /* The type of structured data — do not change this */
  "@type": "Event",

  /* ── EVENT NAME ─────────────────────────────────────────────
     Replace with the exact title of your event as it appears
     on the page. Example: "Holiday Cookie Decorating Workshop" */
  "name": "Holiday Cookie Decorating Workshop",

  /* ── SHORT DESCRIPTION ──────────────────────────────────────
     Write 1–3 sentences describing what the event is about.
     Keep it clear and match the text shown on your page. */
  "description": "Join us for a fun, hands-on cookie decorating workshop at My Baking Creations! Learn professional icing techniques, creative designs, and take home a box of your beautifully decorated treats. All skill levels are welcome — no baking experience required.",

  /* ── START DATE & TIME ──────────────────────────────────────
     Format: YYYY-MM-DDTHH:MM:SS
     Example: 2025-12-06T10:00:00 means December 6, 2025 at 10:00 AM
     Use your local time. Change the date and time to match your event. */
  "startDate": "2025-12-06T10:00:00",

  /* ── END DATE & TIME ────────────────────────────────────────
     Same format as startDate.
     Example: 2025-12-06T12:00:00 means the event ends at 12:00 PM
     on the same day. Adjust if your event spans multiple days. */
  "endDate": "2025-12-06T12:00:00",

  /* ── EVENT STATUS ───────────────────────────────────────────
     Leave as EventScheduled unless the event changes.
     Other options if needed:
       EventCancelled   — if the event is cancelled
       EventPostponed   — if the event is postponed
       EventRescheduled — if the event has a new date */
  "eventStatus": "https://schema.org/EventScheduled",

  /* ── ATTENDANCE MODE ────────────────────────────────────────
     Choose ONE of the following and delete the others:
       OfflineEventAttendanceMode  — in-person event
       OnlineEventAttendanceMode   — virtual/online event
       MixedEventAttendanceMode    — both in-person and online */
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",

  /* ── LOCATION ───────────────────────────────────────────────
     Fill in the physical address where the event takes place.
     Every field below should match your real location details. */
  "location": {
    "@type": "Place",

    /* The name of the venue or your business name */
    "name": "My Baking Creations Studio",

    "address": {
      "@type": "PostalAddress",

      /* Street number and street name */
      "streetAddress": "123 Sweet Street",

      /* City or town */
      "addressLocality": "Your City",

      /* State abbreviation — example: CA, TX, NY, FL */
      "addressRegion": "ST",

      /* ZIP or postal code */
      "postalCode": "00000",

      /* Country code — US for United States */
      "addressCountry": "US"
    }
  },

  /* ── ORGANIZER ──────────────────────────────────────────────
     This is the person or business hosting the event.
     Update the name and url to match your business. */
  "organizer": {
    "@type": "Organization",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  },

  /* ── EVENT IMAGE ────────────────────────────────────────────
     Replace with a direct URL to a real image for this event.
     Recommended size: at least 1200 x 628 pixels.
     Example: "https://mybakingcreations.com/images/cookie-workshop.jpg" */
  "image": "https://mybakingcreations.com/images/event-cookie-decorating-workshop.jpg",

  /* ── TICKET / REGISTRATION URL ──────────────────────────────
     Replace with the link where people can register or buy tickets.
     If registration is free, you can still link to your contact page. */
  "url": "https://mybakingcreations.com/events/holiday-cookie-decorating-workshop",

  /* ── OFFERS (TICKET PRICING) ────────────────────────────────
     Update the price, currency, and availability as needed.
     Set "price" to 0 if the event is free.
     Availability options:
       InStock     — tickets are available
       SoldOut     — event is fully booked
       PreOrder    — tickets available for future purchase */
  "offers": {
    "@type": "Offer",

    /* Ticket or registration page URL */
    "url": "https://mybakingcreations.com/events/holiday-cookie-decorating-workshop",

    /* Price as a number only — no dollar sign */
    "price": "45.00",

    /* Currency code — USD for US Dollars */
    "priceCurrency": "USD",

    /* Ticket availability status */
    "availability": "https://schema.org/InStock",

    /* Date when ticket sales begin — format: YYYY-MM-DD */
    "validFrom": "2025-10-01"
  },

  /* ── PERFORMER (OPTIONAL) ───────────────────────────────────
     If an instructor, chef, or speaker is leading the event,
     add their name here. Delete this section if not applicable. */
  "performer": {
    "@type": "Person",
    "name": "Jane Doe, Head Baker & Instructor"
  }

}
</script>
