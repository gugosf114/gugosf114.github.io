<script type="application/ld+json">
{

       1. Replace all placeholder values with your real information

          https://search.google.com/test/rich-results
       4. Make sure everything here matches what visitors see on
          your actual webpage — Google checks for consistency!
       ============================================================ -->

  "@context": "https://schema.org",

  <!-- The type of schema — "Service" tells Google this page
       describes a service your business offers -->
  "@type": "Service",

  <!-- ── BASIC SERVICE INFORMATION ─────────────────────────────
       Update the name, description, and URL to match your page -->

  <!-- ── SERVICE OUTPUT ─────────────────────────────────────────
       What the customer receives at the end of the service -->
  "serviceOutput": "Freshly baked, custom-decorated cakes and baked goods delivered or ready for pickup",

  <!-- ── AREA SERVED ─────────────────────────────────────────────
       List the cities, regions, or states you serve.

    {
      "@type": "City",
      "name": "Your City Name"

    {
      "@type": "State",
      "name": "Your State Name"
    }

  "audience": {
    "@type": "Audience",

       This image may appear in Google search results! -->

    {
      "@type": "ImageObject",
      "url": "https://mybakingcreations.com/images/custom-celebration-cake.jpg",
      "caption": "Custom celebration cake made by My Baking Creations",

      "height": 630

      "height": 630
    }

        "minPrice": "65.00",
        "maxPrice": "250.00",
        "priceCurrency": "USD"
      },
      "availability": "https://schema.org/InStock",
      "url": "https://mybakingcreations.com/services/birthday-cakes"
    },
    {
      "@type": "Offer",
      "name": "Wedding Cake",

      "price": "350.00",

        "maxPrice": "1200.00",
        "priceCurrency": "USD"

        "priceCurrency": "USD"

      "availability": "https://schema.org/InStock",

      "addressLocality": "Your City",
      "addressRegion": "Your State",
      "postalCode": "00000",
      "addressCountry": "US"
