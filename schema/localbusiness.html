<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",

  <!-- ============================================================
       BUSINESS NAME
       Update this to match exactly how your business name appears
       on your website and Google Business Profile.
  ============================================================ -->
  "name": "My Baking Creations",

  <!-- ============================================================
       WEBSITE URL
       This should be your main website address.
  ============================================================ -->
  "url": "https://mybakingcreations.com",

  <!-- ============================================================
       PHONE NUMBER
       Use your main business phone number.
       Format: "+1-555-555-5555" (include country code)
  ============================================================ -->
  "telephone": "+1-555-123-4567",

  <!-- ============================================================
       EMAIL ADDRESS
       Your primary business contact email address.
  ============================================================ -->
  "email": "hello@mybakingcreations.com",

  <!-- ============================================================
       BUSINESS DESCRIPTION
       A short, clear description of what your business offers.
       Keep it between 1 and 3 sentences.
  ============================================================ -->
  "description": "My Baking Creations is a local bakery specializing in custom cakes, fresh pastries, and handcrafted baked goods made with love for every occasion.",

  <!-- ============================================================
       LOGO
       Replace the URL below with the direct link to your logo image.
       The image should be at least 112x112 pixels.
  ============================================================ -->
  "logo": "https://mybakingcreations.com/images/logo.png",

  <!-- ============================================================
       PROFILE IMAGE
       A photo of your business, storefront, or products.
       Replace with a direct link to your preferred image.
  ============================================================ -->
  "image": "https://mybakingcreations.com/images/storefront.jpg",

  <!-- ============================================================
       PHYSICAL ADDRESS
       Fill in each line with your real business address.
       - streetAddress : building number and street name
       - addressLocality : your city or town
       - addressRegion : your state or province abbreviation
       - postalCode : your ZIP or postal code
       - addressCountry : two-letter country code (US, CA, GB, etc.)
  ============================================================ -->
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "123 Bakery Lane",
    "addressLocality": "Sweet Town",
    "addressRegion": "CA",
    "postalCode": "90210",
    "addressCountry": "US"
  },

  <!-- ============================================================
       GEO COORDINATES
       Latitude and longitude of your business location.
       Find yours by searching your address on Google Maps,
       right-clicking the pin, and copying the coordinates.
       Example: 34.0522 (latitude), -118.2437 (longitude)
  ============================================================ -->
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 34.0522,
    "longitude": -118.2437
  },

  <!-- ============================================================
       MAP LINK
       Paste the full Google Maps URL for your business location.
       Find it by searching your business on Google Maps and
       copying the URL from your browser address bar.
  ============================================================ -->
  "hasMap": "https://maps.google.com/?q=123+Bakery+Lane,+Sweet+Town,+CA+90210",

  <!-- ============================================================
       OPENING HOURS
       List your business hours for each day you are open.
       Format: "DayOfWeek HH:MM-HH:MM" using 24-hour time.
       Days: Monday, Tuesday, Wednesday, Thursday, Friday,
             Saturday, Sunday
       You can combine days with a comma: "Monday,Tuesday"
       Remove or add lines to match your actual schedule.
  ============================================================ -->
  "openingHours": [
    "Monday,Tuesday,Wednesday,Thursday,Friday 07:00-18:00",
    "Saturday 08:00-17:00",
    "Sunday 09:00-14:00"
  ],

  <!-- ============================================================
       PRICE RANGE
       Use dollar signs to indicate your general price range:
       "$"    = inexpensive
       "$$"   = moderate
       "$$$"  = expensive
       "$$$$" = very expensive
  ============================================================ -->
  "priceRange": "$$",

  <!-- ============================================================
       CURRENCIES ACCEPTED
       List the currencies your business accepts.
       Common values: USD, EUR, GBP, CAD, AUD
  ============================================================ -->
  "currenciesAccepted": "USD",

  <!-- ============================================================
       PAYMENT ACCEPTED
       List the payment methods your business accepts.
       Examples: Cash, Credit Card, Check, Invoice
  ============================================================ -->
  "paymentAccepted": "Cash, Credit Card, Debit Card",

  <!-- ============================================================
       SOCIAL MEDIA & OTHER PROFILES
       Add links to all your official social media pages and
       any other online profiles (Yelp, Facebook, Instagram, etc.)
       Remove any lines that do not apply to your business.
  ============================================================ -->
  "sameAs": [
    "https://www.facebook.com/mybakingcreations",
    "https://www.instagram.com/mybakingcreations",
    "https://www.yelp.com/biz/my-baking-creations"
  ],

  <!-- ============================================================
       AREA SERVED
       The city, region, or area your business serves.
       You can list a city name, state, or general region.
  ============================================================ -->
  "areaServed": "Sweet Town, CA and surrounding areas",

  <!-- ============================================================
       FOUNDING YEAR
       The year your business was established.
       Replace 2015 with the actual year you opened.
  ============================================================ -->
  "foundingDate": "2015",

  <!-- ============================================================
       AGGREGATE RATING
       Your overall star rating and total number of reviews.
       - ratingValue : your average star rating (e.g. 4.8)
       - reviewCount : total number of reviews you have received
       Only include this section if you have real reviews.
       Update these numbers to match your actual ratings.
  ============================================================ -->
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.9",
    "reviewCount": "127",
    "bestRating": "5",
    "worstRating": "1"
  }

}
</script>
