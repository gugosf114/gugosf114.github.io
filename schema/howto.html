     2. Paste it into the <head> section of the relevant page
     3. Update the values between the quotation marks to match
        the actual content visible on your page
     4. After updating, test it at:
        https://search.google.com/test/rich-results

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",

  <!-- ── BASIC INFORMATION ──────────────────────────────────────
       name: The title of your how-to recipe or tutorial.
             This should match the heading visible on the page.
       description: A short summary of what the reader will learn
                    or make. Keep it to 1-2 sentences.
  ──────────────────────────────────────────────────────────── -->
  "name": "How to Make Classic Vanilla Buttercream Frosting",
  "description": "Learn how to make a smooth, creamy classic vanilla buttercream frosting perfect for cakes, cupcakes, and cookies. This simple recipe uses just five ingredients and takes under 15 minutes to prepare.",

  <!-- ── IMAGE ─────────────────────────────────────────────────
       image: A direct URL to a photo of the finished result.
              Use a high-quality image that is at least 1200px wide.
              Replace the URL below with your actual image URL.
  ──────────────────────────────────────────────────────────── -->
  "image": {
    "@type": "ImageObject",
    "url": "https://mybakingcreations.com/images/vanilla-buttercream-frosting.jpg",
    "height": "800",
    "width": "1200"
  },

  <!-- ── AUTHOR ─────────────────────────────────────────────────
       author: The person or business who created this tutorial.
               Update "name" to your name or your business name.
  ──────────────────────────────────────────────────────────── -->
  "author": {
    "@type": "Person",
    "name": "My Baking Creations",
    "url": "https://mybakingcreations.com"
  },

  <!-- ── DATES ──────────────────────────────────────────────────
       datePublished: The date this page was first published.
       dateModified:  The date this page was last updated.
       Format: YYYY-MM-DD (Year-Month-Day)
  ──────────────────────────────────────────────────────────── -->
  "datePublished": "2024-01-15",
  "dateModified": "2025-01-10",

  <!-- ── TIME ──────────────────────────────────────────────────
       prepTime:  How long it takes to gather and prepare
                  ingredients before starting.
       performTime: The active time spent making the recipe.
       totalTime: The total time from start to finish.
       Format uses ISO 8601 duration:
         PT5M  = 5 minutes
         PT1H  = 1 hour
         PT1H30M = 1 hour and 30 minutes
  ──────────────────────────────────────────────────────────── -->
  "prepTime": "PT5M",
  "performTime": "PT10M",
  "totalTime": "PT15M",

  <!-- ── ESTIMATED COST ─────────────────────────────────────────
       estimatedCost: An approximate cost to make this recipe.
       Update "value" to the dollar amount and "currency" to
       your currency code (USD, GBP, EUR, CAD, AUD, etc.)
  ──────────────────────────────────────────────────────────── -->
  "estimatedCost": {
    "@type": "MonetaryAmount",
    "currency": "USD",
    "value": "5.00"
  },

  <!-- ── YIELD ─────────────────────────────────────────────────
       yield: How much this recipe makes (servings, pieces, etc.)
  ──────────────────────────────────────────────────────────── -->
  "yield": "Frosts 12 cupcakes or one 9-inch two-layer cake",

  <!-- ── TOOLS NEEDED ───────────────────────────────────────────
       tool: A list of equipment needed to complete this tutorial.
             Add or remove items inside the brackets as needed.
             Each tool needs a "name" field.
  ──────────────────────────────────────────────────────────── -->
  "tool": [
    {
      "@type": "HowToTool",
      "name": "Stand mixer or hand mixer"
    },
    {
      "@type": "HowToTool",
      "name": "Large mixing bowl"
    },
    {
      "@type": "HowToTool",
      "name": "Rubber spatula"
    },
    {
      "@type": "HowToTool",
      "name": "Measuring cups and spoons"
    },
    {
      "@type": "HowToTool",
      "name": "Piping bag and tips (optional, for decorating)"
    }
  ],

  <!-- ── INGREDIENTS / SUPPLIES ─────────────────────────────────
       supply: A list of ingredients or materials needed.
               Add or remove items inside the brackets as needed.
               Each supply needs a "name" field.
  ──────────────────────────────────────────────────────────── -->
  "supply": [
    {
      "@type": "HowToSupply",
      "name": "1 cup (2 sticks) unsalted butter, softened to room temperature"
    },
    {
      "@type": "HowToSupply",
      "name": "4 cups powdered sugar, sifted"
    },
    {
      "@type": "HowToSupply",
      "name": "2 teaspoons pure vanilla extract"
    },
    {
      "@type": "HowToSupply",
      "name": "3 tablespoons heavy cream or whole milk"
    },
    {
      "@type": "HowToSupply",
      "name": "Pinch of salt"
    }
  ],

  <!-- ── STEPS ──────────────────────────────────────────────────
       step: A numbered list of instructions.
             Each step has:
               - "name": A short title for the step (shown as a heading)
               - "text": The full instruction for that step
               - "image": A photo showing that step (optional but recommended)
               - "url":  A link to the specific step on your page (optional)

             HOW TO ADD OR REMOVE STEPS:
             - To add a step, copy one full {...} block and paste it
               after the last step, separated by a comma.
             - To remove a step, delete the entire {...} block for that step.
             - Make sure there is NO comma after the very last step.
  ──────────────────────────────────────────────────────────── -->
  "step": [
    {
      "@type": "HowToStep",
      "position": 1,
      "name": "Soften the Butter",
      "text": "Remove the butter from the refrigerator at least 30 minutes before you begin. The butter should be soft enough to press a finger into easily but should not be melted. Properly softened butter is the key to smooth, fluffy frosting.",
      "image": {
        "@type": "ImageObject",
        "url": "https://mybakingcreations.com/images/steps/step-1-soften-butter.jpg",
        "height": "600",
        "width": "900"
      },
      "url": "https://mybakingcreations.com/vanilla-buttercream-frosting#step-1"
    },
    {
      "@type": "HowToStep",
      "position": 2,
      "name": "Beat the Butter Until Fluffy",
      "text": "Place the softened butter in the bowl of your stand mixer fitted with the paddle attachment, or use a large bowl with a hand mixer. Beat on medium-high speed for 3 to 4 minutes until the butter is pale, light, and very fluffy. Scrape down the sides of the bowl with a rubber spatula halfway through.",
      "image": {
        "@type": "ImageObject",
        "url": "https://mybakingcreations.com/images/steps/step-2-beat-butter.jpg",
        "height": "600",
        "width": "900"
      },
      "url": "https://mybakingcreations.com/vanilla-buttercream-frosting#step-2"
    },
    {
      "@type": "HowToStep",
      "position": 3,
      "name": "Add the Powdered Sugar",
      "text": "With the mixer on low speed, gradually add the sifted powdered sugar one cup at a time. Adding it slowly prevents a sugar cloud from forming. Once all the sugar is added, increase the speed to medium and mix for 1 minute until fully combined.",
      "image": {
        "@type": "ImageObject",
        "url": "https://mybakingcreations.com/images/steps/step-3-add-sugar.jpg",
        "height": "600",
        "width": "900"
      },
      "url": "https://mybakingcreations.com/vanilla-buttercream-frosting#step-3"
    },
    {
      "@type": "HowToStep",
      "position": 4,
      "name": "Add Vanilla, Cream, and Salt",
      "text": "Add the vanilla extract, 2 tablespoons of heavy cream, and a pinch of salt. Mix on medium speed for 1 minute. Check the consistency — if the frosting is too thick, add the remaining tablespoon of cream. If it is too thin, add a few more tablespoons of powdered sugar.",
      "image": {
        "@type": "ImageObject",
        "url": "https://mybakingcreations.com/images/steps/step-4-add-vanilla.jpg",
        "height": "600",
        "width": "900"
      },
      "url": "https://mybakingcreations.com/vanilla-buttercream-frosting#step-4"
    },
    {
      "@type": "HowToStep",
      "position": 5,
      "name": "Whip to Final Consistency",
      "text": "Increase the mixer speed to medium-high and beat the frosting for a final 2 minutes. This extra whipping makes the frosting extra light and airy. Scrape down the sides of the bowl once more and give it a final stir with the spatula to ensure everything is evenly mixed.",
      "image": {
        "@type": "ImageObject",
        "url": "https://mybakingcreations.com/images/steps/step-5-whip-frosting.jpg",
        "height": "600",
        "width": "900"
      },
      "url": "https://mybakingcreations.com/vanilla-buttercream-frosting#step-5"
    },
    {
      "@type": "HowToStep",
      "position": 6,
      "name": "Use or Store the Frosting",
      "text": "Your buttercream is now ready to use! Spread it onto cooled cakes or cupcakes using a spatula, or transfer it to a piping bag for decorating. If not using immediately, store the frosting in an airtight container in the refrigerator for up to one week. Re-whip briefly before using.",
      "image": {
        "@type": "ImageObject",
        "url": "https://mybakingcreations.com/images/steps/step-6-frost-cupcakes.jpg",
        "height": "600",
        "width": "900"
      },
      "url": "https://mybakingcreations.com/vanilla-buttercream-frosting#step-6"
    }
  ]

}
</script>
