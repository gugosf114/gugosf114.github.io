      "@type": "HowToSupply",

      "position": 2,
      "name": "Cream the Butter and Sugar",
      "text": "In the bowl of a stand mixer fitted with the paddle attachment, beat the softened butter and granulated sugar together on medium-high speed for 3–4 minutes until the mixture is pale, light, and fluffy. Scrape down the sides of the bowl as needed.",

      "@type": "HowToStep",
      "position": 3,
      "name": "Add the Eggs and Vanilla",
      "text": "Add the eggs one at a time, beating well after each addition. Scrape down the sides of the bowl between additions. Add the vanilla extract and mix until fully combined. The batter should look smooth and creamy.",

      "url": "https://mybakingcreations.com/how-to-bake-vanilla-layer-cake#step-4",
      "image": "https://mybakingcreations.com/images/step-4-dry-ingredients.jpg"
    },
    {
      "@type": "HowToStep",
      "position": 5,
      "name": "Alternate Adding Dry Ingredients and Milk",
      "text": "With the mixer on low speed, add the dry ingredient mixture in three additions, alternating with the milk in two additions (dry, milk, dry, milk, dry). Begin and end with the dry ingredients. Mix just until each addition is incorporated — do not overmix.",
      "url": "https://mybakingcreations.com/how-to-bake-vanilla-layer-cake#step-5",
      "image": "https://mybakingcreations.com/images/step-5-alternate-dry-wet.jpg"
    },
    {
      "@type": "HowToStep",
      "position": 6,
      "name": "Divide the Batter and Bake",
      "text": "Divide the batter evenly between the two prepared cake pans. Smooth the tops with a rubber spatula. Bake in the preheated oven for 28–32 minutes, or until a toothpick inserted into the center comes out clean and the edges are just beginning to pull away from the sides of the pan.",
      "url": "https://mybakingcreations.com/how-to-bake-vanilla-layer-cake#step-6",
      "image": "https://mybakingcreations.com/images/step-6-bake-cake.jpg"
    },
