name: Gemini AI Automation & Lighthouse CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gemini-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://mybakingcreations.com/
          budgetPath: .github/lighthouse-budget.json # Optional budget
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          prompt: |
            Perform a comprehensive review and optimization pass on this repository.
            1. Code Review: Identify bugs, security vulnerabilities, and code quality issues in changed files.
            2. SEO & Accessibility: Check all HTML/Markdown files for missing alt text, meta descriptions, and improper heading structures.
            3. Asset Optimization: Verify if there are unoptimized images or large assets that could be compressed.
            4. Lighthouse Audit: Review the Lighthouse CI artifacts/scores. If performance or SEO scores drop below 90, flag it and suggest fixes.
            5. If this is a pull request, provide a detailed summary of findings as a PR comment. 
            6. If there are obvious fixes for SEO or simple bugs, apply the fixes and commit them directly to the branch.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
