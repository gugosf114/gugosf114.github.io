name: Jana Edit Review & Auto-Merge

on:
  push:
    branches:
      - jana-edits

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout jana-edits
        uses: actions/checkout@v4
        with:
          ref: jana-edits
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git fetch origin main
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only origin/main...HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(git diff --name-only origin/main...HEAD | wc -l)" >> $GITHUB_OUTPUT

      - name: Validate images
        id: images
        run: |
          ERRORS=""
          while IFS= read -r file; do
            if [[ "$file" =~ \.(jpg|jpeg|png|webp|gif)$ ]]; then
              if [ -f "$file" ]; then
                SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
                # Flag images over 5MB
                if [ "$SIZE" -gt 5242880 ]; then
                  ERRORS="$ERRORS\n⚠️ $file is $(($SIZE/1048576))MB — should be under 5MB"
                fi
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          if [ -n "$ERRORS" ]; then
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate HTML
        id: html
        run: |
          ERRORS=""
          while IFS= read -r file; do
            if [[ "$file" =~ \.html$ ]]; then
              if [ -f "$file" ]; then
                # Check for broken image references
                grep -oP 'src="([^"]+)"' "$file" | sed 's/src="//;s/"//' | while read -r src; do
                  if [[ "$src" != http* ]] && [[ "$src" != data:* ]] && [ ! -f "$src" ]; then
                    ERRORS="$ERRORS\n⚠️ $file references missing file: $src"
                  fi
                done
                # Check for unclosed tags (basic)
                if grep -qP '<[^/!][^>]*[^/]>$' "$file" 2>/dev/null; then
                  : # Basic HTML, skip deep validation
                fi
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          if [ -n "$ERRORS" ]; then
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-merge if clean
        if: steps.images.outputs.has_errors == 'false' && steps.html.outputs.has_errors == 'false'
        run: |
          git config user.name "Jana Auto-Merge Bot"
          git config user.email "info@mybakingcreations.com"
          git checkout main
          git merge origin/jana-edits --no-ff -m "Auto-merge jana-edits: ${{ steps.changed.outputs.count }} file(s) changed"
          git push origin main

      - name: Flag issues if problems found
        if: steps.images.outputs.has_errors == 'true' || steps.html.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const imageErrors = `${{ steps.images.outputs.errors || 'None' }}`;
            const htmlErrors = `${{ steps.html.outputs.errors || 'None' }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Jana edit needs review',
              body: `## Auto-review found issues\n\n**Image issues:**\n${imageErrors}\n\n**HTML issues:**\n${htmlErrors}\n\n**Changed files:**\n${{ steps.changed.outputs.files }}\n\nReview the \`jana-edits\` branch and merge manually if OK.`,
              assignees: ['gugosf114']
            });
